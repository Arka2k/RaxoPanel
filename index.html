<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyAuth · Orange Panel</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,sans-serif; }

  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d0d0f;
    background-image:
      radial-gradient(circle at 20% 20%, #ff8c1a15 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, #ff8c1a10 0%, transparent 40%);
    padding:20px;
    color:#e8e8e8;
  }

  /* ---------- PANEL PRINCIPAL ---------- */
  .keyauth-panel {
    width:100%;
    max-width:480px;
    background:#16161a;
    border:1px solid #2a2a30;
    border-radius:14px;
    padding:32px 28px;
    box-shadow:
      0 20px 60px -15px rgba(0,0,0,0.9),
      0 0 0 1px rgba(255,140,26,0.08),
      0 0 60px -20px rgba(255,140,26,0.25);
    position:relative;
    overflow:hidden;
  }

  /* ligne orange en haut */
  .keyauth-panel::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, transparent, #ff8c1a, transparent);
  }

  /* ---------- LOGO / TITRE ---------- */
  .ka-header {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
  }

  .ka-logo {
    width:52px;
    height:52px;
    border-radius:12px;
    background:linear-gradient(135deg, #ff8c1a, #ff6a00);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    box-shadow:0 8px 20px -6px rgba(255,140,26,0.5);
    margin-bottom:14px;
  }

  .ka-title {
    font-size:20px;
    font-weight:700;
    color:#fff;
    letter-spacing:-0.3px;
  }

  .ka-subtitle {
    font-size:13px;
    color:#7a7a85;
    margin-top:4px;
  }

  /* ---------- STATUS ---------- */
  .ka-status {
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1c1c22;
    border:1px solid #2a2a30;
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:16px;
    font-size:13px;
  }

  .ka-status-label {
    color:#7a7a85;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .ka-status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 8px #22c55e;
    animation:pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }

  .ka-status-value {
    color:#ff8c1a;
    font-weight:600;
    font-family:'SF Mono','Fira Code',monospace;
    font-size:12px;
  }

  /* ---------- KEY DISPLAY ---------- */
  .ka-key-box {
    background:#1c1c22;
    border:1px solid #2a2a30;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
    transition:border-color 0.2s;
  }

  .ka-key-box:hover {
    border-color:#ff8c1a55;
  }

  .ka-key-label {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#7a7a85;
    margin-bottom:8px;
    font-weight:600;
  }

  .ka-key-value {
    font-family:'SF Mono','Fira Code',monospace;
    font-size:15px;
    font-weight:600;
    color:#ff8c1a;
    letter-spacing:1px;
    cursor:pointer;
    user-select:all;
    word-break:break-all;
    transition:color 0.15s;
  }

  .ka-key-value:hover {
    color:#ffb74d;
  }

  /* ---------- HWID BOX ---------- */
  .ka-hwid-box {
    background:#1c1c22;
    border:1px solid #2a2a30;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }

  .ka-hwid-box::after {
    content:'';
    position:absolute;
    top:0; left:0;
    width:3px;
    height:100%;
    background:#ff8c1a;
  }

  .ka-hwid-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }

  .ka-hwid-label {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#7a7a85;
    font-weight:600;
  }

  .ka-hwid-badge {
    font-size:10px;
    background:#ff8c1a20;
    color:#ff8c1a;
    border:1px solid #ff8c1a40;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .ka-hwid-value {
    font-family:'SF Mono','Fira Code',monospace;
    font-size:14px;
    color:#e8e8e8;
    letter-spacing:0.5px;
    word-break:break-all;
  }

  /* ---------- BUTTONS ---------- */
  .ka-btn {
    width:100%;
    padding:13px 20px;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:all 0.15s ease;
    font-family:inherit;
  }

  .ka-btn-primary {
    background:linear-gradient(135deg, #ff8c1a, #ff6a00);
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(255,140,26,0.6);
    margin-bottom:10px;
  }

  .ka-btn-primary:hover {
    transform:translateY(-1px);
    box-shadow:0 12px 25px -8px rgba(255,140,26,0.8);
    background:linear-gradient(135deg, #ffa040, #ff7a10);
  }

  .ka-btn-primary:active {
    transform:translateY(1px);
    box-shadow:0 4px 12px -6px rgba(255,140,26,0.6);
  }

  .ka-btn-secondary {
    background:#1c1c22;
    color:#b8b8c0;
    border:1px solid #2a2a30;
  }

  .ka-btn-secondary:hover {
    background:#22222a;
    color:#fff;
    border-color:#ff8c1a40;
  }

  /* ---------- FOOTER ---------- */
  .ka-footer {
    margin-top:20px;
    text-align:center;
    font-size:11px;
    color:#5a5a65;
    letter-spacing:0.3px;
  }

  .ka-footer span {
    color:#ff8c1a;
    font-weight:600;
  }

  /* ---------- LOADER ---------- */
  .ka-spinner {
    width:16px;
    height:16px;
    border:2px solid #ffffff40;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
  }

  .ka-btn-primary.loading .ka-spinner {
    display:block;
  }

  .ka-btn-primary.loading .ka-btn-icon {
    display:none;
  }

  @keyframes spin {
    to { transform:rotate(360deg); }
  }

  /* ---------- TOAST ---------- */
  .ka-toast {
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1c1c22;
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:13px;
    font-weight:500;
    border:1px solid #2a2a30;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.9);
    opacity:0;
    transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index:9999;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:90%;
  }

  .ka-toast.show {
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }

  .ka-toast.success {
    border-color:#22c55e40;
  }

  .ka-toast.success .ka-toast-dot {
    background:#22c55e;
    box-shadow:0 0 8px #22c55e;
  }

  .ka-toast.error {
    border-color:#ef444440;
  }

  .ka-toast.error .ka-toast-dot {
    background:#ef4444;
    box-shadow:0 0 8px #ef4444;
  }

  .ka-toast-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff8c1a;
    box-shadow:0 0 8px #ff8c1a;
    flex-shrink:0;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:520px) {
    .keyauth-panel { padding:26px 20px; border-radius:12px; }
    .ka-key-value { font-size:13px; }
    .ka-hwid-value { font-size:12px; }
  }
</style>
</head>
<body>

<div class="keyauth-panel">

  <!-- Header -->
  <div class="ka-header">
    <div class="ka-logo">🔐</div>
    <div class="ka-title">KeyAuth Panel</div>
    <div class="ka-subtitle">License Management System</div>
  </div>

  <!-- Status -->
  <div class="ka-status">
    <div class="ka-status-label">
      <span class="ka-status-dot"></span>
      Statut du compte
    </div>
    <div class="ka-status-value" id="statusValue">ACTIF</div>
  </div>

  <!-- Key -->
  <div class="ka-key-box">
    <div class="ka-key-label">License Key</div>
    <div class="ka-key-value" id="keyValue" title="Cliquez pour copier">
      ORNG-7X9K-2M4P-8Q1Z
    </div>
  </div>

  <!-- HWID -->
  <div class="ka-hwid-box">
    <div class="ka-hwid-header">
      <div class="ka-hwid-label">Hardware ID (HWID)</div>
      <div class="ka-hwid-badge" id="hwidBadge">Lié</div>
    </div>
    <div class="ka-hwid-value" id="hwidValue">A1B2-C3D4-E5F6-7890</div>
  </div>

  <!-- Boutons -->
  <button class="ka-btn ka-btn-primary" id="resetBtn">
    <span class="ka-btn-icon">🔄</span>
    <span class="ka-spinner"></span>
    <span id="resetBtnText">Reset HWID</span>
  </button>

  <button class="ka-btn ka-btn-secondary" id="copyBtn">
    📋 Copier la clé
  </button>

  <!-- Footer -->
  <div class="ka-footer">
    Propulsé par <span>KeyAuth</span> · v1.0
  </div>

</div>

<!-- Toast -->
<div class="ka-toast" id="toast">
  <span class="ka-toast-dot"></span>
  <span id="toastText">Message</span>
</div>

<script>
(function() {
  // ---------- ÉLÉMENTS ----------
  const keyValue = document.getElementById('keyValue');
  const hwidValue = document.getElementById('hwidValue');
  const hwidBadge = document.getElementById('hwidBadge');
  const resetBtn = document.getElementById('resetBtn');
  const resetBtnText = document.getElementById('resetBtnText');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const statusValue = document.getElementById('statusValue');

  // ---------- UTILITAIRES ----------
  function generateHWID() {
    const chars = 'ABCDEF0123456789';
    const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
    return [seg(), seg(), seg(), seg()].join('-');
  }

  function generateKey() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
    const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
    return [seg(), seg(), seg(), seg()].join('-');
  }

  function showToast(message, type = 'info') {
    toastText.textContent = message;
    toast.className = 'ka-toast show ' + type;
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2800);
  }

  function setLoading(state) {
    if (state) {
      resetBtn.classList.add('loading');
      resetBtn.disabled = true;
      resetBtnText.textContent = 'Réinitialisation...';
    } else {
      resetBtn.classList.remove('loading');
      resetBtn.disabled = false;
      resetBtnText.textContent = 'Reset HWID';
    }
  }

  // ---------- ACTIONS ----------
  function resetHWID() {
    setLoading(true);
    hwidBadge.textContent = 'Reset...';
    hwidBadge.style.color = '#ffb74d';
    hwidBadge.style.background = '#ffb74d20';
    hwidBadge.style.borderColor = '#ffb74d40';

    // simulation d'appel API (comme KeyAuth)
    setTimeout(() => {
      const newHWID = generateHWID();
      const newKey = generateKey();

      hwidValue.textContent = newHWID;
      keyValue.textContent = newKey;

      hwidBadge.textContent = 'Lié';
      hwidBadge.style.color = '#ff8c1a';
      hwidBadge.style.background = '#ff8c1a20';
      hwidBadge.style.borderColor = '#ff8c1a40';

      statusValue.textContent = 'ACTIF';
      statusValue.style.color = '#ff8c1a';

      setLoading(false);
      showToast('HWID réinitialisé avec succès', 'success');
    }, 1200);
  }

  function copyKey() {
    const key = keyValue.textContent.trim();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(key)
        .then(() => showToast('Clé copiée : ' + key, 'success'))
        .catch(() => showToast('Erreur de copie', 'error'));
    } else {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = key;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Clé copiée : ' + key, 'success');
    }
  }

  // ---------- ÉVÉNEMENTS ----------
  resetBtn.addEventListener('click', resetHWID);
  copyBtn.addEventListener('click', copyKey);
  keyValue.addEventListener('click', copyKey);

  // double-clic sur la clé = régénérer uniquement la clé
  keyValue.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const newKey = generateKey();
    keyValue.textContent = newKey;
    showToast('Nouvelle clé générée : ' + newKey, 'success');
  });

  // ---------- INIT ----------
  // état initial : compte lié
  statusValue.textContent = 'ACTIF';
  statusValue.style.color = '#ff8c1a';
  hwidBadge.textContent = 'Lié';
})();
</script>

</body>
</html>
