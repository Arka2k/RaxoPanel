<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0505">
<title>Raxo — Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0505; --panel:rgba(30,16,10,.88); --panel-2:rgba(38,20,12,.88);
  --side:rgba(28,14,8,.82); --text:#fff8f2; --text-2:#e8d5c4;
  --mute:#a88a72; --dim:#5a4030;
  --orange:#ff7a1a; --orange-2:#ffa64d; --orange-3:#e56a0a;
  --orange-glow:rgba(255,122,26,.45);
  --ok:#8fd9a8; --warn:#e8c88a;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1200px 600px at 15% -10%,rgba(255,122,26,.10),transparent 55%),
  radial-gradient(900px 500px at 90% 110%,rgba(255,122,26,.06),transparent 55%)}
button,input{font:inherit;color:inherit}
input{font-weight:600}
[hidden]{display:none!important}
::selection{background:var(--orange-glow);color:#fff}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,122,26,.40),rgba(255,122,26,.15));border-radius:12px;border:3px solid transparent;background-clip:padding-box}

@keyframes riseIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(255,122,26,.55))}50%{filter:drop-shadow(0 0 40px rgba(255,122,26,.95))}}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

#login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:100;background:
  radial-gradient(1000px 700px at 50% -10%,rgba(255,122,26,.18),transparent 60%),
  radial-gradient(900px 600px at 85% 110%,rgba(255,122,26,.10),transparent 60%),var(--bg)}
.lbox{position:relative;z-index:2;width:100%;max-width:440px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),
  linear-gradient(180deg,rgba(30,16,10,.96),rgba(20,10,5,.94));
  backdrop-filter:blur(30px);border:1px solid rgba(255,122,26,.25);border-radius:28px;
  padding:44px 36px;box-shadow:0 60px 140px -40px rgba(0,0,0,1),0 0 80px -20px rgba(255,122,26,.30);
  animation:riseIn .9s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
.lbox::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),#fff,var(--orange-2),transparent);
  background-size:200% 100%;animation:flow 4s linear infinite}
.logo-wrap{width:80px;height:80px;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,122,26,.14),rgba(255,255,255,.03));
  border:1px solid rgba(255,122,26,.35);display:grid;place-items:center;margin:0 auto 24px;
  box-shadow:0 15px 40px -10px var(--orange-glow);
  animation:float 4s ease-in-out infinite,glow 3s ease-in-out infinite;
  overflow:hidden;padding:12px}
.logo-wrap img{width:100%;height:100%;object-fit:contain}
.logo-wrap .fallback{font-size:38px;font-weight:900;color:var(--orange)}
.lbox h1{font-size:28px;font-weight:800;letter-spacing:-.035em;margin-bottom:8px;text-align:center;
  background:linear-gradient(180deg,#fff,var(--orange-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lbox p{color:var(--mute);margin-bottom:32px;font-size:14px;text-align:center}
.lbox input{width:100%;padding:16px 18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,122,26,.20);
  border-radius:14px;margin-bottom:16px;outline:none;transition:all .25s;font-size:15px;font-weight:600;color:#fff}
.lbox input::placeholder{color:rgba(232,213,196,.4)}
.lbox input:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow)}
.err{color:var(--orange-2);font-size:13px;margin-top:16px;padding:14px 16px;background:rgba(255,122,26,.10);
  border-radius:12px;border-left:3px solid var(--orange);font-weight:600;animation:slideRight .35s ease both}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;
  border:1px solid rgba(255,122,26,.20);background:linear-gradient(180deg,rgba(255,122,26,.10),rgba(255,122,26,.02));
  font-weight:700;font-size:13.5px;cursor:pointer;transition:all .22s;white-space:nowrap;color:var(--text-2)}
.btn:hover{border-color:rgba(255,122,26,.45);background:linear-gradient(180deg,rgba(255,122,26,.18),rgba(255,122,26,.05));transform:translateY(-2px);color:#fff}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.red{background:linear-gradient(135deg,var(--orange-2),var(--orange) 60%,var(--orange-3));
  border-color:rgba(255,140,50,.55);color:#1a0e05;font-weight:800;box-shadow:0 8px 24px -8px var(--orange-glow);
  width:100%;padding:16px 18px;font-size:15px}
.btn.red:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.10);color:var(--text-2)}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,122,26,.35);color:#fff}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.btn.sm svg{width:13px;height:13px}
.btn.danger:hover{color:#ff5555;border-color:rgba(255,85,85,.55);background:rgba(255,85,85,.10)}
.btn:disabled{opacity:.4;cursor:not-allowed}

#app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;position:relative;z-index:2}
#app:not([hidden]){animation:fadeIn .6s}
aside{background:linear-gradient(180deg,rgba(255,122,26,.04),transparent 40%),var(--side);
  backdrop-filter:blur(28px);border-right:1px solid rgba(255,122,26,.10);
  padding:24px 16px;display:flex;flex-direction:column;gap:5px;
  position:sticky;top:0;height:100vh;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;padding:8px 12px 26px;position:relative}
.brand::after{content:"";position:absolute;bottom:12px;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,122,26,.25),transparent)}
.brand .logo{width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,122,26,.14),rgba(255,255,255,.03));
  border:1px solid rgba(255,122,26,.30);display:grid;place-items:center;overflow:hidden;padding:6px;flex:0 0 auto}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .logo .fallback{font-size:22px;font-weight:900;color:var(--orange)}
.brand .name b{color:#fff;display:block;font-weight:800}
.brand .name small{display:block;font-size:10.5px;font-weight:700;color:var(--orange-2);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}

.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--mute);
  font-weight:600;font-size:14px;cursor:pointer;background:none;border:0;text-align:left;width:100%;
  transition:all .22s;position:relative;overflow:hidden}
.nav::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(255,122,26,.16),rgba(255,122,26,.03) 60%,transparent);
  opacity:0;transition:opacity .22s}
.nav:hover{color:var(--text-2);transform:translateX(3px)}
.nav:hover::before{opacity:1}
.nav.on{color:#fff;transform:translateX(4px)}
.nav.on::before{opacity:1}
.nav.on::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  background:linear-gradient(180deg,var(--orange),var(--orange-3));border-radius:0 3px 3px 0;box-shadow:0 0 14px var(--orange-glow)}
.nav > *{position:relative;z-index:1}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav.on svg{color:var(--orange)}
.nav small{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--orange-2);
  background:rgba(255,122,26,.10);padding:3px 9px;border-radius:7px;min-width:26px;text-align:center}
.nav.on small{color:#0a0505;background:linear-gradient(180deg,var(--orange-2),var(--orange))}
.bottom{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,122,26,.10)}

main{padding:32px 40px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:32px;animation:riseIn .6s both}
.page-head{display:flex;flex-direction:column;gap:6px}
h1.t{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.15;
  background:linear-gradient(180deg,#fff,var(--orange-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.t-sub{font-size:14px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap}

.card{background:linear-gradient(180deg,rgba(255,122,26,.03),transparent 250px),var(--panel);
  backdrop-filter:blur(20px);border:1px solid rgba(255,122,26,.12);border-radius:22px;overflow:hidden;
  animation:riseIn .55s both;position:relative}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,122,26,.55),rgba(255,255,255,.25),transparent)}

.tb{display:flex;gap:12px;padding:18px 20px;border-bottom:1px solid rgba(255,122,26,.08);flex-wrap:wrap;align-items:center}
.tb input{background:rgba(0,0,0,.5);border:1px solid rgba(255,122,26,.18);border-radius:12px;
  padding:12px 16px;outline:none;font-size:14px;font-weight:600;color:#fff;flex:1;min-width:200px}
.tb input::placeholder{color:rgba(232,213,196,.4)}
.tb input:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow)}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;padding:14px 20px;font-size:11.5px;color:var(--orange-2);font-weight:800;
  background:rgba(0,0,0,.45);border-bottom:1px solid rgba(255,122,26,.15);text-transform:uppercase;
  letter-spacing:1px;white-space:nowrap}
td{padding:16px 20px;border-bottom:1px solid rgba(255,122,26,.06);white-space:nowrap;font-size:13.5px}
tbody tr:hover{background:linear-gradient(90deg,rgba(255,122,26,.06),transparent)}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--orange)}

.key,.hw{font-family:var(--mono);font-size:12.5px;font-weight:600}
.key{color:var(--orange-2);cursor:pointer;padding:5px 10px;border-radius:8px;background:rgba(255,122,26,.10);
  border:1px solid rgba(255,122,26,.25);display:inline-block}
.key:hover{background:rgba(255,122,26,.20);border-color:rgba(255,122,26,.55);color:#fff}
.hw{color:var(--text-2)}
.mut{color:var(--mute);font-size:13px}

.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;
  font-size:11.5px;font-weight:800;border:1px solid transparent}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.badge.active{color:var(--ok);background:rgba(143,217,168,.14);border-color:rgba(143,217,168,.25)}
.badge.expired{color:var(--warn);background:rgba(232,200,138,.14);border-color:rgba(232,200,138,.25)}
.badge.banned{color:var(--orange);background:rgba(255,122,26,.18);border-color:rgba(255,122,26,.35)}
.badge.active::before{animation:pulse 2.4s ease-in-out infinite}

.row{display:flex;gap:8px}
.view{display:none}
.view.on{display:block;animation:riseIn .5s}
.empty{padding:60px 24px;text-align:center;color:var(--dim);font-size:14px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.10),rgba(255,255,255,.03));
  background-size:200% 100%;animation:shimmer 1.4s linear infinite;width:80%}
tr.skeleton td{padding:18px 20px}

.modal{position:fixed;inset:0;background:rgba(6,3,0,.80);display:grid;place-items:center;padding:20px;
  z-index:200;animation:fadeIn .3s;backdrop-filter:blur(14px)}
.box{background:linear-gradient(180deg,rgba(255,122,26,.05),transparent 120px),
  linear-gradient(180deg,rgba(38,20,12,.99),rgba(20,10,6,.99));border:1px solid rgba(255,122,26,.25);
  border-radius:22px;width:100%;max-width:480px;padding:32px;box-shadow:0 60px 140px -30px #000;
  animation:popIn .45s;position:relative;overflow:hidden}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),#fff,transparent);background-size:200% 100%;
  animation:flow 3s linear infinite}
.modal-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;
  border-bottom:1px solid rgba(255,122,26,.10)}
.modal-header .modal-logo{width:52px;height:52px;border-radius:12px;background:rgba(255,122,26,.10);
  border:1px solid rgba(255,122,26,.30);display:grid;place-items:center;overflow:hidden;padding:7px}
.modal-header .modal-logo img{width:100%;height:100%;object-fit:contain}
.modal-header .modal-logo .fallback{font-size:24px;font-weight:900;color:var(--orange)}
.modal-title b{font-size:18px;font-weight:800;color:#fff;display:block;line-height:1.2}
.modal-title span{font-size:11px;font-weight:800;color:var(--orange-2);letter-spacing:1.2px;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.fld label{font-size:11.5px;font-weight:800;color:var(--orange-2);text-transform:uppercase;letter-spacing:1px}
.fld input{background:rgba(0,0,0,.5);border:1px solid rgba(255,122,26,.18);border-radius:12px;
  padding:12px 16px;outline:none;font-size:14px;font-weight:600;color:#fff;width:100%}
.fld input:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.out{background:rgba(0,0,0,.6);border:1px solid rgba(255,122,26,.20);border-radius:12px;
  padding:16px 18px;font-family:var(--mono);font-size:12.5px;color:var(--orange-2);font-weight:600;
  max-height:240px;overflow:auto;white-space:pre;margin-bottom:16px;line-height:1.8}

#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:12px;z-index:300;pointer-events:none}
.toast{display:flex;align-items:center;gap:13px;
  background:linear-gradient(180deg,rgba(50,25,12,.98),rgba(30,15,8,.98));
  border:1px solid rgba(255,122,26,.25);border-left:3px solid var(--orange);border-radius:14px;
  padding:15px 20px;min-width:260px;font-weight:700;font-size:13.5px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.95);animation:slideLeft .4s;pointer-events:auto;color:#fff8f0}
.toast svg{width:18px;height:18px;color:var(--orange)}
.toast.success svg{color:var(--ok)}
.toast.error svg{color:#ff5555}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,122,26,.05),transparent 60%),var(--panel);
  border:1px solid rgba(255,122,26,.15);border-radius:16px;padding:22px 24px;animation:riseIn .5s both}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent,var(--orange)),transparent)}
.stat .ico{width:38px;height:38px;border-radius:11px;background:var(--accent-bg,rgba(255,122,26,.10));
  color:var(--accent,var(--orange));display:grid;place-items:center;margin-bottom:14px}
.stat span{display:block;font-size:11.5px;color:var(--mute);font-weight:800;text-transform:uppercase;
  letter-spacing:1.2px;margin-bottom:6px}
.stat b{display:block;font-size:36px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--accent,var(--text))}
.stat[data-tone="ok"]{--accent:var(--ok);--accent-bg:rgba(143,217,168,.12)}
.stat[data-tone="warn"]{--accent:var(--warn);--accent-bg:rgba(232,200,138,.12)}
.stat[data-tone="bad"]{--accent:#ff5555;--accent-bg:rgba(255,85,85,.12)}
.stat[data-tone="total"]{--accent:var(--orange-2);--accent-bg:rgba(255,122,26,.12)}

.quick{padding:16px 20px;border-bottom:1px solid rgba(255,122,26,.08);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick .lbl{font-size:11.5px;color:var(--orange-2);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-right:10px}
.quick button{padding:8px 15px;font-size:12.5px;border-radius:10px;border:1px solid rgba(255,122,26,.18);
  background:rgba(255,122,26,.05);color:var(--text-2);font-weight:700;cursor:pointer;transition:all .22s}
.quick button:hover{border-color:var(--orange);color:#fff;background:rgba(255,122,26,.18);transform:translateY(-2px)}

@media(max-width:960px){
  #app{grid-template-columns:1fr}
  aside{position:sticky;top:0;height:auto;width:100%;flex-direction:row;align-items:center;gap:8px;
    padding:12px 14px;border-right:0;border-bottom:1px solid rgba(255,122,26,.10);overflow-x:auto}
  .brand{padding:0 12px 0 0}.brand::after{display:none}.brand .name{display:none}
  .nav{width:auto;padding:10px 14px;font-size:13px}.nav.on::after{display:none}
  .bottom{margin:0 0 0 auto;padding:0;border:0}.bottom .btn .txt{display:none}
  main{padding:20px 18px 60px}
  h1.t{font-size:26px}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat b{font-size:26px}
  table{min-width:0}thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{background:var(--panel-2);border:1px solid rgba(255,122,26,.15);border-radius:16px;padding:18px 20px;margin-bottom:12px}
  td{border:0;padding:9px 0;display:flex;justify-content:space-between;gap:14px}
  td::before{content:attr(data-l);color:var(--orange-2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  td .row .btn{flex:1}
  .modal{padding:0;place-items:end center}
  .box{border-radius:28px 28px 0 0;padding:26px 20px;max-height:92dvh;overflow-y:auto}
  .box::before{display:none}
  .two{grid-template-columns:1fr}
  #toasts{left:14px;right:14px}.toast{min-width:0;width:100%}
  .lbox{padding:36px 26px}
}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm" autocomplete="off">
    <div class="logo-wrap">
      <img src="raxo.png" alt="Raxo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="fallback" style="display:none">R</span>
    </div>
    <h1>Raxo Panel</h1>
    <p>Connecte-toi pour gérer tes licences Akeiro.</p>
    <input type="password" id="adminKey" placeholder="Clé d'administration" autocomplete="off" spellcheck="false">
    <button class="btn red" type="submit" id="loginBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      Se connecter
    </button>
    <div class="err" id="loginErr" hidden></div>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand">
      <div class="logo">
        <img src="raxo.png" alt="Raxo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="fallback" style="display:none">R</span>
      </div>
      <div class="name"><b>Raxo</b><small>Admin Panel</small></div>
    </div>

    <button class="nav on" data-view="keys">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Licences <small id="nKeys">0</small>
    </button>
    <button class="nav" data-view="hwid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      HWID bannis <small id="nHwid">0</small>
    </button>
    <button class="nav" data-view="logs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Logs
    </button>

    <div class="bottom">
      <button class="btn ghost" id="logout" style="width:100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="txt">Déconnexion</span>
      </button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div class="page-head">
        <h1 class="t" id="title">Licences</h1>
        <span class="t-sub" id="subtitle">Gère les clés Akeiro</span>
      </div>
      <div class="acts">
        <button class="btn ghost" id="refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg>
          <span class="txt">Rafraîchir</span>
        </button>
        <button class="btn red" id="newKey" style="width:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="txt">Nouvelle clé</span>
        </button>
      </div>
    </div>

    <section class="view on" id="v-keys">
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="quick">
          <span class="lbl">⚡ Génération rapide</span>
          <button type="button" data-quick="1">1 jour</button>
          <button type="button" data-quick="3">3 jours</button>
          <button type="button" data-quick="7">7 jours</button>
          <button type="button" data-quick="30">30 jours</button>
          <button type="button" data-quick="90">90 jours</button>
          <button type="button" data-quick="365">1 an</button>
        </div>
        <div class="tb">
          <input id="q" type="search" placeholder="Rechercher une clé ou un HWID…">
        </div>
        <div class="scroll"><table>
          <thead><tr><th>Clé</th><th>Statut</th><th>Durée</th><th>HWID</th><th>Expire le</th><th>Restant</th><th></th></tr></thead>
          <tbody id="keysBody"></tbody>
        </table></div>
        <div class="empty" id="keysEmpty">Chargement…</div>
      </div>
    </section>

    <section class="view" id="v-hwid">
      <div class="card">
        <div class="tb">
          <input id="newHwid" type="text" placeholder="HWID à bannir" autocomplete="off" spellcheck="false">
          <button class="btn red" id="banHwid" style="width:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            Bannir ce HWID
          </button>
        </div>
        <div class="scroll"><table>
          <thead><tr><th>HWID banni</th><th>Ajouté le</th><th></th></tr></thead>
          <tbody id="hwidBody"></tbody>
        </table></div>
        <div class="empty" id="hwidEmpty">Chargement…</div>
      </div>
    </section>

    <section class="view" id="v-logs">
      <div class="card">
        <div class="scroll"><table>
          <thead><tr><th>Date</th><th>Type</th><th>Détail</th></tr></thead>
          <tbody id="logsBody"></tbody>
        </table></div>
        <div class="empty" id="logsEmpty">Chargement…</div>
      </div>
    </section>
  </main>
</div>

<div id="toasts"></div>

<script>
"use strict";

// ═══════════════════════════════════════════════════════
// CONFIG — Modifie ces 2 lignes si besoin
// ═══════════════════════════════════════════════════════
const API_URL = "https://raxo-api.raxoshopp.workers.dev";

let adminKey = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtLeft = ms => {
  if (ms <= 0) return '0m';
  const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), m = Math.floor((ms % 36e5) / 6e4);
  return d ? `${d}j ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const statusOf = k => k.banned ? 'banned' : Date.now() > k.expiresAt ? 'expired' : 'active';
const statusNames = { active: 'Active', expired: 'Expirée', banned: 'Bannie' };

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'success' ? 'success' : 'error');
  el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">' +
    (type === 'success' ? '<polyline points="20 6 9 17 4 12"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>') +
    '</svg><span>' + esc(msg) + '</span>';
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

async function callAPI(action, params = {}){
  const qs = new URLSearchParams({ action, admin: adminKey, ...params });
  const r = await fetch(`${API_URL}/?${qs}`);
  return r.json();
}

// LOGIN
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('adminKey').value.trim();
  if (!v) return;
  adminKey = v;
  $('loginBtn').disabled = true;
  $('loginErr').hidden = true;
  try {
    const r = await callAPI('list');
    if (r.ok){
      sessionStorage.setItem('raxo_admin_key', v);
      $('login').hidden = true;
      $('app').hidden = false;
      start();
    } else {
      $('loginErr').textContent = r.error === 'UNAUTHORIZED' ? 'Clé admin invalide.' : (r.error || 'Erreur');
      $('loginErr').hidden = false;
      adminKey = '';
      $('adminKey').value = '';
    }
  } catch {
    $('loginErr').textContent = 'API injoignable. Vérifie ta connexion.';
    $('loginErr').hidden = false;
    adminKey = '';
  }
  $('loginBtn').disabled = false;
});

$('logout').onclick = () => {
  sessionStorage.removeItem('raxo_admin_key');
  location.reload();
};

// NAV
const titles = {
  keys: ['Licences', 'Gère les clés Akeiro'],
  hwid: ['HWID bannis', 'Liste noire des identifiants matériels'],
  logs: ['Logs', 'Historique des événements du panel']
};
document.querySelectorAll('.nav').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n === b));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + b.dataset.view));
  const [t, s] = titles[b.dataset.view] || ['', ''];
  $('title').textContent = t;
  $('subtitle').textContent = s;
  $('newKey').hidden = b.dataset.view !== 'keys';
  if (b.dataset.view === 'hwid') loadBlacklist();
  if (b.dataset.view === 'logs') loadLogs();
});

// STATS
function renderStats(keys){
  const c = { active: 0, expired: 0, banned: 0 };
  keys.forEach(k => c[statusOf(k)]++);
  $('stats').innerHTML = [
    ['Total', keys.length, 'total'],
    ['Actives', c.active, 'ok'],
    ['Expirées', c.expired, 'warn'],
    ['Bannies', c.banned, 'bad']
  ].map(([a, b, tone]) =>
    `<div class="stat" data-tone="${tone}">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg></div>
      <span>${a}</span><b>${b}</b>
    </div>`
  ).join('');
}

// KEYS
let allKeys = [];

async function loadKeys(){
  $('keysEmpty').hidden = true;
  $('keysBody').innerHTML = '<tr class="skeleton"><td colspan="7"><div class="sk"></div></td></tr>'.repeat(5);
  try {
    const r = await callAPI('list');
    if (!r.ok){ toast(r.error || 'Erreur', 'error'); return; }
    allKeys = r.keys || [];
    renderStats(allKeys);
    renderRows();
    $('nKeys').textContent = allKeys.length;
  } catch {
    toast('Erreur de chargement', 'error');
    $('keysEmpty').hidden = false;
    $('keysEmpty').textContent = 'Impossible de charger les clés.';
  }
}

function renderRows(){
  const q = ($('q').value || '').trim().toUpperCase();
  const rows = !q ? allKeys : allKeys.filter(k =>
    k.key.toUpperCase().includes(q) || (k.hwid || '').toUpperCase().includes(q)
  );
  $('keysEmpty').hidden = rows.length > 0;
  $('keysEmpty').textContent = allKeys.length ? 'Aucune clé ne correspond.' : 'Aucune clé. Crée-en une.';
  const frag = document.createDocumentFragment();
  rows.forEach(k => {
    const s = statusOf(k);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-l="Clé"><span class="key" data-copy="${esc(k.key)}">${esc(k.key)}</span></td>
      <td data-l="Statut"><span class="badge ${s}">${statusNames[s]}</span></td>
      <td data-l="Durée" class="mut">${esc(k.days || '?')} j</td>
      <td data-l="HWID">${k.hwid ? `<span class="hw">${esc(k.hwid)}</span>` : '<span class="mut"><i>libre</i></span>'}</td>
      <td data-l="Expire le" class="mut">${fmtDate(k.expiresAt)}</td>
      <td data-l="Restant" class="mut">${s === 'active' ? fmtLeft(k.expiresAt - Date.now()) : '—'}</td>
      <td data-l="Actions"><div class="row">
        <button class="btn ghost sm" data-act="${k.banned ? 'unban' : 'ban'}" data-key="${esc(k.key)}">${k.banned ? 'Débannir' : 'Bannir'}</button>
        <button class="btn ghost sm" data-act="del" data-key="${esc(k.key)}">Suppr.</button>
      </div></td>`;
    frag.appendChild(tr);
  });
  $('keysBody').replaceChildren(frag);
}

$('q').oninput = renderRows;

$('keysBody').addEventListener('click', async e => {
  const cp = e.target.closest('[data-copy]');
  if (cp){
    try { await navigator.clipboard.writeText(cp.dataset.copy); toast('Clé copiée', 'success'); }
    catch { toast('Copie impossible', 'error'); }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const key = b.dataset.key, a = b.dataset.act;
  if (a === 'del' && !confirm('Supprimer définitivement cette clé ?')) return;
  if (a === 'ban' && !confirm('Bannir cette clé ?')) return;
  b.disabled = true;
  try {
    const r = await callAPI(a, { key });
    if (r.ok){
      toast({ ban: 'Clé bannie', unban: 'Clé réactivée', del: 'Clé supprimée' }[a], 'success');
      await loadKeys();
    } else {
      toast(r.error || 'Erreur', 'error');
      b.disabled = false;
    }
  } catch { toast('Erreur réseau', 'error'); b.disabled = false; }
});

// MODAL NEW KEY
$('newKey').onclick = () => openNewKeyModal(30);
document.querySelectorAll('[data-quick]').forEach(btn => {
  btn.onclick = () => openNewKeyModal(parseInt(btn.dataset.quick, 10));
});

function openNewKeyModal(days){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box">
    <div class="modal-header">
      <div class="modal-logo">
        <img src="raxo.png" alt="Raxo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="fallback" style="display:none">R</span>
      </div>
      <div class="modal-title"><b>Raxo</b><span>Créer une nouvelle clé Akeiro</span></div>
    </div>
    <div class="two">
      <div class="fld"><label>Durée (jours)</label><input id="nDays" type="number" min="1" max="9999" value="${days}"></div>
      <div class="fld"><label>Quantité</label><input id="nq" type="number" min="1" max="100" value="1"></div>
    </div>
    <div class="fld"><label>HWID (facultatif)</label><input id="nh" placeholder="Laisser vide pour une clé libre"></div>
    <div class="foot">
      <button class="btn ghost" id="c1">Annuler</button>
      <button class="btn red" id="c2" style="width:auto">Créer</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector('#c1').onclick = close;
  m.addEventListener('mousedown', e => { if (e.target === m) close(); });
  m.querySelector('#nq').focus();

  m.querySelector('#c2').onclick = async () => {
    const daysVal = Math.max(1, parseInt(m.querySelector('#nDays').value, 10) || 30);
    const quantity = Math.max(1, Math.min(100, parseInt(m.querySelector('#nq').value, 10) || 1));
    const hwid = m.querySelector('#nh').value.trim().toUpperCase() || '';
    m.querySelector('#c2').disabled = true;
    try {
      const r = await callAPI('create', { days: daysVal, quantity, hwid });
      if (!r.ok){ toast(r.error || 'Erreur', 'error'); m.querySelector('#c2').disabled = false; return; }
      close();
      toast(r.created.length + ' clé(s) ' + daysVal + 'j créée(s)', 'success');
      await loadKeys();
      const rm = document.createElement('div');
      rm.className = 'modal';
      rm.innerHTML = `<div class="box">
        <div class="modal-header">
          <div class="modal-logo">
            <img src="raxo.png" alt="Raxo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <span class="fallback" style="display:none">R</span>
          </div>
          <div class="modal-title"><b>Raxo</b><span>Clés Akeiro générées</span></div>
        </div>
        <div class="out"></div>
        <div class="foot">
          <button class="btn ghost" id="r1">Fermer</button>
          <button class="btn red" id="r2" style="width:auto">Copier tout</button>
        </div>
      </div>`;
      rm.querySelector('.out').textContent = r.created.join('\n');
      rm.querySelector('#r1').onclick = () => rm.remove();
      rm.querySelector('#r2').onclick = async () => {
        try { await navigator.clipboard.writeText(r.created.join('\n')); toast('Copié', 'success'); }
        catch { toast('Copie impossible', 'error'); }
      };
      rm.addEventListener('mousedown', e => { if (e.target === rm) rm.remove(); });
      document.body.appendChild(rm);
    } catch { toast('Erreur réseau', 'error'); m.querySelector('#c2').disabled = false; }
  };
}

// BLACKLIST
let allBlacklist = [];

async function loadBlacklist(){
  try {
    const r = await callAPI('list-blacklist');
    if (!r.ok) throw new Error();
    allBlacklist = r.blacklist || [];
    renderBlacklist();
    $('nHwid').textContent = allBlacklist.length;
  } catch {
    $('hwidEmpty').hidden = false;
    $('hwidEmpty').textContent = 'Impossible de charger la blacklist.';
  }
}

function renderBlacklist(){
  $('hwidEmpty').hidden = allBlacklist.length > 0;
  $('hwidEmpty').textContent = 'Aucun HWID banni.';
  const frag = document.createDocumentFragment();
  allBlacklist.forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-l="HWID"><span class="hw" style="color:#ffb066">${esc(b.hwid)}</span></td>
      <td data-l="Ajouté le" class="mut">${fmtDate(b.ts)}</td>
      <td data-l=""><button class="btn ghost sm" data-h="${esc(b.hwid)}">Retirer</button></td>`;
    frag.appendChild(tr);
  });
  $('hwidBody').replaceChildren(frag);
}

$('banHwid').onclick = async () => {
  const v = $('newHwid').value.trim().toUpperCase();
  if (!v) return toast('Entre un HWID', 'error');
  try {
    const r = await callAPI('blacklist', { hwid: v });
    if (!r.ok) return toast(r.error || 'Erreur', 'error');
    $('newHwid').value = '';
    toast('HWID banni', 'success');
    await loadBlacklist();
  } catch { toast('Erreur réseau', 'error'); }
};
$('newHwid').addEventListener('keydown', e => { if (e.key === 'Enter') $('banHwid').click(); });

$('hwidBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-h]');
  if (!b) return;
  const hwid = b.dataset.h;
  if (!confirm(`Retirer ${hwid} de la blacklist ?`)) return;
  b.disabled = true;
  try {
    const r = await callAPI('unblacklist', { hwid });
    if (r.ok){ toast('HWID retiré', 'success'); await loadBlacklist(); }
    else { toast(r.error || 'Erreur', 'error'); b.disabled = false; }
  } catch { toast('Erreur réseau', 'error'); b.disabled = false; }
});

// LOGS
const L = {
  create: ['Création', 'active'], ban: ['Ban', 'banned'], unban: ['Déban', 'active'],
  delete: ['Suppression', 'expired'], 'hwid-ban': ['HWID banni', 'banned'],
  'hwid-unban': ['HWID retiré', 'active'], 'auth-ok': ['Connexion', 'active'],
  'auth-banned': ['Clé bannie', 'banned'], 'auth-expired': ['Clé expirée', 'expired'],
  'auth-hwid-banned': ['HWID banni', 'banned'], 'auth-hwid-mismatch': ['HWID diff.', 'expired']
};

async function loadLogs(){
  try {
    const r = await callAPI('list-logs');
    if (!r.ok && r.error !== 'UNKNOWN_ACTION') throw new Error();
    const list = r.logs || [];
    $('logsEmpty').hidden = list.length > 0;
    $('logsEmpty').textContent = 'Aucun log.';
    const frag = document.createDocumentFragment();
    list.forEach(l => {
      const [lab, cls] = L[l.type] || [l.type || '—', 'active'];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-l="Date" class="mut">${fmtDate(l.ts)}</td>
        <td data-l="Type"><span class="badge ${cls}">${esc(lab)}</span></td>
        <td data-l="Détail">${esc(l.detail || '')}</td>`;
      frag.appendChild(tr);
    });
    $('logsBody').replaceChildren(frag);
  } catch {
    $('logsEmpty').hidden = false;
    $('logsEmpty').textContent = 'Impossible de charger les logs.';
  }
}

$('refresh').onclick = () => {
  loadKeys();
  loadBlacklist();
  loadLogs();
  toast('Actualisé', 'success');
};

function start(){
  loadKeys();
  loadBlacklist();
  loadLogs();
}

// AUTO LOGIN
const savedKey = sessionStorage.getItem('raxo_admin_key');
if (savedKey){
  adminKey = savedKey;
  callAPI('list').then(r => {
    if (r.ok){
      $('login').hidden = true;
      $('app').hidden = false;
      start();
    } else {
      sessionStorage.removeItem('raxo_admin_key');
      adminKey = '';
    }
  }).catch(() => {
    sessionStorage.removeItem('raxo_admin_key');
    adminKey = '';
  });
}
</script>
</body>
</html>
